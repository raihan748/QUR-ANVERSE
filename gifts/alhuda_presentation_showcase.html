<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al-Huda - Interactive Presentation Gift & Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Outfit:wght@400;600;800;900&family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #0b4e2b 0%, #06331d 40%, #032012 75%, #011109 100%);
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
    }

    /* Ambient Background Geometric Stars Pattern */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(rgba(16, 185, 129, 0.12) 1.5px, transparent 1.5px),
        radial-gradient(rgba(245, 158, 11, 0.08) 1.5px, transparent 1.5px);
      background-size: 40px 40px, 80px 80px;
      background-position: 0 0, 20px 20px;
      pointer-events: none;
      z-index: 1;
    }

    /* Canvas for Realtime Floating Particles */
    #particleCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* 4 Ornamental Islamic Corners */
    .corner-ornament {
      position: absolute;
      width: 140px;
      height: 140px;
      pointer-events: none;
      z-index: 5;
      opacity: 0.85;
      filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.4));
    }
    .corner-tl { top: 24px; left: 24px; }
    .corner-tr { top: 24px; right: 24px; transform: scaleX(-1); }
    .corner-bl { bottom: 24px; left: 24px; transform: scaleY(-1); }
    .corner-br { bottom: 24px; right: 24px; transform: scale(-1, -1); }

    /* Central Stage */
    .stage {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      transition: transform 0.15s cubic-bezier(0.2, 0, 0.2, 1);
    }

    /* Concentric Islamic Sacred Rings (Rotating) */
    .mandala-outer {
      position: absolute;
      width: 680px;
      height: 680px;
      border-radius: 50%;
      border: 2px dashed rgba(245, 158, 11, 0.35);
      animation: spinClockwise 80s linear infinite;
      pointer-events: none;
      z-index: -2;
      box-shadow: 0 0 60px rgba(16, 185, 129, 0.15);
    }

    .mandala-inner {
      position: absolute;
      width: 540px;
      height: 540px;
      border-radius: 50%;
      border: 2px solid rgba(16, 185, 129, 0.35);
      animation: spinCounterClockwise 60s linear infinite;
      pointer-events: none;
      z-index: -1;
    }

    .mandala-star {
      position: absolute;
      width: 460px;
      height: 460px;
      opacity: 0.18;
      animation: spinClockwise 120s linear infinite;
      pointer-events: none;
      z-index: -1;
    }

    /* Floating Shield & Logo Container */
    .floating-shield-wrapper {
      animation: floatingBob 4.2s ease-in-out infinite;
      transform-style: preserve-3d;
      position: relative;
    }

    .shadow-pod {
      position: absolute;
      bottom: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 38px;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0) 75%);
      border-radius: 50%;
      animation: shadowBreath 4.2s ease-in-out infinite;
      z-index: -3;
    }

    /* Neobrutalist Emblem Card */
    .logo-emblem {
      width: 360px;
      height: 360px;
      border-radius: 80px;
      background: linear-gradient(135deg, #094726 0%, #053019 100%);
      border: 8px solid #000;
      box-shadow: 14px 14px 0px 0px #000, 0 0 50px rgba(16, 185, 129, 0.35);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .logo-emblem:active {
      transform: scale(0.97);
    }

    .inner-border-gold {
      position: absolute;
      inset: 16px;
      border-radius: 65px;
      border: 4px dashed #F59E0B;
      pointer-events: none;
    }

    .quran-icon-svg {
      width: 260px;
      height: 260px;
      filter: drop-shadow(4px 6px 0px #000);
      transform: translateY(-8px);
    }

    /* Text Showcase */
    .title-banner {
      margin-top: 36px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 48px;
      letter-spacing: 6px;
      color: #F59E0B;
      text-shadow: 
        4px 4px 0px #000,
        -2px -2px 0px #000,
        2px -2px 0px #000,
        -2px 2px 0px #000,
        0 0 25px rgba(245, 158, 11, 0.6);
      animation: titleGlow 3.5s ease-in-out infinite;
    }

    .badge-pill {
      background: #063820;
      border: 3px solid #000;
      box-shadow: 4px 4px 0px 0px #000;
      padding: 8px 24px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #A7F3D0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sub-meta {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #6EE7B7;
      opacity: 0.85;
      text-transform: uppercase;
    }

    /* Controls HUD */
    .hud-controls {
      position: fixed;
      bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 20;
      transition: opacity 0.3s;
    }

    .hud-btn {
      background: #FFFDF7;
      color: #000;
      border: 3px solid #000;
      box-shadow: 3px 3px 0px 0px #000;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .hud-btn:hover {
      background: #F59E0B;
      transform: translateY(-2px);
      box-shadow: 4px 4px 0px 0px #000;
    }

    .hud-btn:active {
      transform: translateY(1px);
      box-shadow: 1px 1px 0px 0px #000;
    }

    /* Keyframes */
    @keyframes floatingBob {
      0%, 100% {
        transform: translateY(0px) rotateX(0deg);
      }
      50% {
        transform: translateY(-30px) rotateX(2.5deg);
      }
    }

    @keyframes shadowBreath {
      0%, 100% {
        transform: translateX(-50%) scale(1);
        opacity: 0.7;
      }
      50% {
        transform: translateX(-50%) scale(0.78);
        opacity: 0.3;
      }
    }

    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes spinCounterClockwise {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes titleGlow {
      0%, 100% {
        filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.4));
      }
      50% {
        filter: drop-shadow(0 0 25px rgba(16, 185, 129, 0.8));
      }
    }

    .burst-star {
      position: absolute;
      pointer-events: none;
      animation: starBurst 1s ease-out forwards;
      z-index: 15;
    }

    @keyframes starBurst {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.4) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(var(--rot));
      }
    }
  </style>
</head>
<body>

  <!-- Background Canvas for Sparkles -->
  <div class="bg-grid"></div>
  <canvas id="particleCanvas"></canvas>

  <!-- Islamic Ornamental Corners -->
  <svg class="corner-ornament corner-tl" viewBox="0 0 100 100">
    <path d="M 0,0 L 90,0 Q 90,40 40,40 Q 40,90 0,90 Z" fill="none" stroke="#F59E0B" stroke-width="4"/>
    <path d="M 12,12 L 75,12 Q 75,32 32,32 Q 32,75 12,75 Z" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="2"/>
    <circle cx="24" cy="24" r="6" fill="#F59E0B"/>
    <path d="M 0,50 Q 50,50 50,0" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4,4"/>
  </svg>

  <svg class="corner-ornament corner-tr" viewBox="0 0 100 100">
    <path d="M 0,0 L 90,0 Q 90,40 40,40 Q 40,90 0,90 Z" fill="none" stroke="#F59E0B" stroke-width="4"/>
    <path d="M 12,12 L 75,12 Q 75,32 32,32 Q 32,75 12,75 Z" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="2"/>
    <circle cx="24" cy="24" r="6" fill="#F59E0B"/>
    <path d="M 0,50 Q 50,50 50,0" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4,4"/>
  </svg>

  <svg class="corner-ornament corner-bl" viewBox="0 0 100 100">
    <path d="M 0,0 L 90,0 Q 90,40 40,40 Q 40,90 0,90 Z" fill="none" stroke="#F59E0B" stroke-width="4"/>
    <path d="M 12,12 L 75,12 Q 75,32 32,32 Q 32,75 12,75 Z" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="2"/>
    <circle cx="24" cy="24" r="6" fill="#F59E0B"/>
    <path d="M 0,50 Q 50,50 50,0" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4,4"/>
  </svg>

  <svg class="corner-ornament corner-br" viewBox="0 0 100 100">
    <path d="M 0,0 L 90,0 Q 90,40 40,40 Q 40,90 0,90 Z" fill="none" stroke="#F59E0B" stroke-width="4"/>
    <path d="M 12,12 L 75,12 Q 75,32 32,32 Q 32,75 12,75 Z" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="2"/>
    <circle cx="24" cy="24" r="6" fill="#F59E0B"/>
    <path d="M 0,50 Q 50,50 50,0" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4,4"/>
  </svg>

  <!-- Central Stage -->
  <div class="stage" id="stage">
    <!-- Rotating Sacred Geometry -->
    <div class="mandala-outer"></div>
    <div class="mandala-inner"></div>
    <svg class="mandala-star" viewBox="0 0 200 200">
      <rect x="30" y="30" width="140" height="140" rx="18" fill="none" stroke="#F59E0B" stroke-width="3"/>
      <rect x="30" y="30" width="140" height="140" rx="18" fill="none" stroke="#F59E0B" stroke-width="3" transform="rotate(45 100 100)"/>
    </svg>

    <!-- Floating Shield & Logo -->
    <div class="floating-shield-wrapper">
      <div class="shadow-pod"></div>

      <div class="logo-emblem" id="logoCard" title="Klik untuk memunculkan efek percikan bintang emas!">
        <div class="inner-border-gold"></div>

        <!-- Full AL-HUDA Vector Icon -->
        <svg class="quran-icon-svg" viewBox="0 0 512 512">
          <!-- Star Watermark -->
          <g transform="translate(256, 230)" fill="#F59E0B" opacity="0.18">
            <rect x="-140" y="-140" width="280" height="280" rx="28"/>
            <rect x="-140" y="-140" width="280" height="280" rx="28" transform="rotate(45)"/>
          </g>

          <!-- Open Mushaf -->
          <g transform="translate(256, 210)">
            <path d="M -180 30 C -120 5, -30 5, 0 35 C 30 5, 120 5, 180 30 L 180 160 C 120 135, 30 135, 0 165 C -30 135, -120 135, -180 160 Z" fill="#000000" transform="translate(10, 10)"/>
            
            <path d="M -180 30 C -120 5, -30 5, 0 35 L 0 165 C -30 135, -120 135, -180 160 Z" fill="#FFFDF7" stroke="#000000" stroke-width="10"/>
            
            <path d="M 0 35 C 30 5, 120 5, 180 30 L 180 160 C 120 135, 30 135, 0 165 Z" fill="#F59E0B" stroke="#000000" stroke-width="10"/>
            
            <path d="M 0 35 L 0 195 L 14 175 L 28 195 L 28 40" fill="#EF4444" stroke="#000000" stroke-width="6"/>
            
            <line x1="-150" y1="65" x2="-30" y2="65" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
            <line x1="-150" y1="95" x2="-30" y2="95" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
            <line x1="-150" y1="125" x2="-50" y2="125" stroke="#111827" stroke-width="6" stroke-linecap="round"/>

            <line x1="30" y1="65" x2="150" y2="65" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
            <line x1="30" y1="95" x2="150" y2="95" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
            <line x1="50" y1="125" x2="150" y2="125" stroke="#111827" stroke-width="6" stroke-linecap="round"/>

            <g transform="translate(0, -50)">
              <circle cx="0" cy="0" r="42" fill="#10B981" stroke="#000000" stroke-width="8"/>
              <path d="M -18 0 L -12 -12 L -6 12 L 0 -18 L 6 18 L 12 -12 L 18 0" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </g>
          </g>

          <text x="256" y="440" font-family="'Outfit', sans-serif" font-weight="900" font-size="52" fill="#F59E0B" text-anchor="middle" stroke="#000000" stroke-width="6" letter-spacing="8">AL-HUDA</text>
        </svg>
      </div>
    </div>

    <!-- Title & Presentation Banner -->
    <div class="title-banner">
      <h1 class="brand-title">AL-HUDA</h1>
      <div class="badge-pill">
        <span>✨</span>
        <span>TANYA AZMAN • AL-HUDA AI MUROJA'AH</span>
        <span>✨</span>
      </div>
      <p class="sub-meta">
        STANDAR KEMENAG RI • 30 JUZ RASM UTSMANI • 100% BEBAS API KEY
      </p>
    </div>
  </div>

  <!-- Presentation HUD Controls -->
  <div class="hud-controls" id="hudControls">
    <button class="hud-btn" id="fsBtn" onclick="toggleFullscreen()">
      <span>🖥️</span> Layar Penuh (F11)
    </button>
    <button class="hud-btn" onclick="triggerBurst()">
      <span>✨</span> Percikan Bintang
    </button>
    <button class="hud-btn" onclick="toggleHUD()">
      <span>👁️</span> Sembunyikan Tombol
    </button>
  </div>

  <script>
    // 1. Mouse Parallax 3D Tilt Effect
    const stage = document.getElementById('stage');
    let targetTiltX = 0;
    let targetTiltY = 0;
    let currentTiltX = 0;
    let currentTiltY = 0;

    window.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      const x = (e.clientX / innerWidth - 0.5) * 2; // -1 to 1
      const y = (e.clientY / innerHeight - 0.5) * 2; // -1 to 1
      targetTiltY = x * 16;
      targetTiltX = -y * 16;
    });

    function renderParallax() {
      currentTiltX += (targetTiltX - currentTiltX) * 0.1;
      currentTiltY += (targetTiltY - currentTiltY) * 0.1;
      stage.style.transform = `rotateX(${currentTiltX}deg) rotateY(${currentTiltY}deg)`;
      requestAnimationFrame(renderParallax);
    }
    renderParallax();

    // 2. Realtime Emerald & Gold Particle Canvas
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + Math.random() * 50;
        this.size = Math.random() * 3 + 1.2;
        this.speedY = Math.random() * 0.8 + 0.3;
        this.speedX = (Math.random() - 0.5) * 0.6;
        this.opacity = Math.random() * 0.7 + 0.2;
        this.color = Math.random() > 0.45 ? '#10B981' : '#F59E0B';
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        if (this.y < -10) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.opacity;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    for (let i = 0; i < 70; i++) {
      const p = new Particle();
      p.y = Math.random() * canvas.height;
      particles.push(p);
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // 3. Interactive Star Burst on Click
    function createBurstAt(x, y) {
      const colors = ['#F59E0B', '#10B981', '#FFFDF7', '#34D399'];
      for (let i = 0; i < 16; i++) {
        const angle = (Math.PI * 2 / 16) * i;
        const dist = Math.random() * 140 + 80;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist;
        const rot = Math.random() * 360;

        const star = document.createElement('div');
        star.className = 'burst-star';
        star.style.left = `${x}px`;
        star.style.top = `${y}px`;
        star.style.setProperty('--tx', `${tx}px`);
        star.style.setProperty('--ty', `${ty}px`);
        star.style.setProperty('--rot', `${rot}deg`);

        const color = colors[Math.floor(Math.random() * colors.length)];
        star.innerHTML = `
          <svg width="24" height="24" viewBox="0 0 24 24" fill="${color}">
            <polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9"/>
          </svg>
        `;
        document.body.appendChild(star);
        setTimeout(() => star.remove(), 1000);
      }
    }

    const logoCard = document.getElementById('logoCard');
    logoCard.addEventListener('click', (e) => {
      const rect = logoCard.getBoundingClientRect();
      createBurstAt(rect.left + rect.width / 2, rect.top + rect.height / 2);
    });

    function triggerBurst() {
      const rect = logoCard.getBoundingClientRect();
      createBurstAt(rect.left + rect.width / 2, rect.top + rect.height / 2);
    }

    // 4. Fullscreen & HUD controls
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function toggleHUD() {
      const hud = document.getElementById('hudControls');
      hud.style.opacity = hud.style.opacity === '0' ? '1' : '0';
      hud.style.pointerEvents = hud.style.opacity === '0' ? 'none' : 'auto';
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        toggleHUD();
      }
      if (e.key === 'b' || e.key === 'B' || e.key === ' ') {
        triggerBurst();
      }
    });
  </script>
</body>
</html>
