name: Build Al-Huda Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21 (Capacitor 8 Compatible)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Install Project Dependencies
        run: npm ci

      - name: Compile Web Production Assets
        run: npm run build

      - name: Sync Web Assets to Android App
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          npx cap copy android || true

      - name: Update Capacitor Android Plugins
        run: npx cap update android || true

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle_build.log
          cd ..

      - name: Locate and Stage APK Output
        run: |
          echo "### Gradle Build Log (Last 80 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 gradle_build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "Scanning all APK files in workspace..."
          find . -name "*.apk"

          echo "Listing android/app/build/outputs..."
          ls -R android/app/build/outputs 2>/dev/null || echo "No outputs dir"

          APK_PATH=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found after build!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" ./al-huda.apk
          mkdir -p public/download
          cp ./al-huda.apk public/download/al-huda.apk
          ls -lh ./al-huda.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: al-huda-native-apk
          path: ./al-huda.apk
          retention-days: 30

      - name: Publish or Update Latest GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Al-Huda Android Native APK (Latest Build)"
          body: |
            ## 📱 Al-Huda Native Android App (.APK)
            Official Android binary build for **Al-Huda**.
            
            - **App Name:** Al-Huda
            - **Package:** com.quranverse.app
            - **Fitur Unggulan:** 
              - Alarm Adzan Otomatis saat Layar Mati (Doze Mode)
              - Audio Muadzin Masjid Nabawi Syekh Muhammad Marwan Al-Qassas
              - Mode Muroja'ah Real-time AI & Tanya Azman
              - Standar Mushaf Madinah 604 Halaman Offline
              
            *Otomatis di-compile dari commit terbaru branch `main`.*
          draft: false
          prerelease: false
          files: |
            ./al-huda.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
