name: Build Al-Huda Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21 (Capacitor 8 Compatible)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Install Project Dependencies
        run: npm ci

      - name: Compile Web Production Assets
        run: npm run build

      - name: Sync Web Assets to Android App
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          npx cap copy android || true

      - name: Update Capacitor Android Plugins
        run: npx cap update android || true

      - name: Build Android Debug APK with Gradle
        run: |
          mkdir -p android/app/libs android/capacitor-cordova-android-plugins/src/main/libs android/capacitor-cordova-android-plugins/libs
          cd android
          if ./gradlew assembleDebug --no-daemon --stacktrace > ../gradle_err.txt 2>&1; then
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
            echo "✅ Gradle build succeeded!"
            tail -n 20 ../gradle_err.txt
          else
            echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
            echo "❌ Gradle build failed! Showing error tail:"
            tail -n 120 ../gradle_err.txt
          fi
          cd ..

      - name: Emit Gradle Error Annotations & Summary
        if: always()
        run: |
          if [ -f gradle_err.txt ]; then
            echo "### 📋 Gradle Build Diagnostics" >> $GITHUB_STEP_SUMMARY
            if grep -q "What went wrong:" gradle_err.txt; then
              echo "#### ❌ Root Cause:" >> $GITHUB_STEP_SUMMARY
              echo '```text' >> $GITHUB_STEP_SUMMARY
              grep -A 20 "What went wrong:" gradle_err.txt >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              
              grep -C 5 "What went wrong:" gradle_err.txt | head -n 20 | while IFS= read -r line; do
                if [ -n "$line" ]; then
                  echo "::error title=GradleCause::$line"
                fi
              done
            fi
            
            if grep -q "Caused by:" gradle_err.txt; then
              echo "#### ⚠️ Caused By:" >> $GITHUB_STEP_SUMMARY
              echo '```text' >> $GITHUB_STEP_SUMMARY
              grep -C 3 "Caused by:" gradle_err.txt | head -n 30 >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              
              grep -C 2 "Caused by:" gradle_err.txt | head -n 15 | while IFS= read -r line; do
                if [ -n "$line" ]; then
                  echo "::error title=GradleCausedBy::$line"
                fi
              done
            fi
          fi

      - name: Stage APK Output
        run: |
          if [ ! -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "CRITICAL: APK was not generated!"
            exit 1
          fi
          APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          echo "Found APK at: $APK_SRC"
          cp "$APK_SRC" ./al-huda.apk
          mkdir -p public/download
          cp ./al-huda.apk public/download/al-huda.apk
          ls -lh ./al-huda.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: al-huda-native-apk
          path: ./al-huda.apk
          retention-days: 30

      - name: Publish or Update Latest GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Al-Huda Android Native APK (Latest Build)"
          body: |
            ## 📱 Al-Huda Native Android App (.APK)
            Official Android binary build for **Al-Huda**.
            
            - **App Name:** Al-Huda
            - **Package:** com.quranverse.app
            - **Fitur Unggulan:** 
              - Alarm Adzan Otomatis saat Layar Mati (Doze Mode)
              - Audio Muadzin Masjid Nabawi Syekh Muhammad Marwan Al-Qassas
              - Mode Muroja'ah Real-time AI & Tanya Bayan (AI Copilot & Navigasi Interaktif)
              - Standar Mushaf Madinah 604 Halaman Offline
              
            *Otomatis di-compile dari commit terbaru branch `main`.*
          draft: false
          prerelease: false
          files: |
            ./al-huda.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
