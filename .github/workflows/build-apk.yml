name: Build Al-Huda Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21 (Capacitor 8 Compatible)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Install Project Dependencies
        run: npm ci

      - name: Compile Web Production Assets
        run: npm run build

      - name: Copy Assets to Android App
        run: npx cap copy android

      - name: Update Capacitor Android Plugins
        run: npx cap update android

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..

      - name: Stage APK Output
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./al-huda.apk
          mkdir -p public/download
          cp ./al-huda.apk public/download/al-huda.apk
          ls -lh ./al-huda.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: al-huda-native-apk
          path: ./al-huda.apk
          retention-days: 30

      - name: Publish or Update Latest GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Al-Huda Android Native APK (Latest Build)"
          body: |
            ## 📱 Al-Huda Native Android App (.APK)
            Official Android binary build for **Al-Huda**.
            
            - **App Name:** Al-Huda
            - **Package:** com.quranverse.app
            - **Fitur Unggulan:** 
              - Alarm Adzan Otomatis saat Layar Mati (Doze Mode)
              - Audio Muadzin Masjid Nabawi Syekh Muhammad Marwan Al-Qassas
              - Mode Muroja'ah Real-time AI & Tanya Azman
              - Standar Mushaf Madinah 604 Halaman Offline
              
            *Otomatis di-compile dari commit terbaru branch `main`.*
          draft: false
          prerelease: false
          files: |
            ./al-huda.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
