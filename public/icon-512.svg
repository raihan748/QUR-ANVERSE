<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="hudaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#01180E"/>
      <stop offset="35%" stop-color="#03301B"/>
      <stop offset="70%" stop-color="#054527"/>
      <stop offset="100%" stop-color="#01130A"/>
    </linearGradient>

    <!-- Divine Radiance / Light of Guidance (Nur Al-Huda) -->
    <radialGradient id="nurGuidanceGlow" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.45"/>
      <stop offset="25%" stop-color="#10B981" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#047857" stop-opacity="0.15"/>
      <stop offset="85%" stop-color="#F59E0B" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- 24K Royal Gold Metallic Gradient -->
    <linearGradient id="gold24k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="20%" stop-color="#FDE68A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#D97706"/>
      <stop offset="90%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Pages Gradient -->
    <linearGradient id="pageLeftLuminous" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="pageRightLuminous" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="40%" stop-color="#FEF9E7"/>
      <stop offset="80%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Silk Bookmark Ribbon -->
    <linearGradient id="rubyRibbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="40%" stop-color="#E11D48"/>
      <stop offset="85%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Emerald Gem Core -->
    <radialGradient id="emeraldGem" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="80%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022C1A"/>
    </radialGradient>

    <!-- Filters for Divine Glow -->
    <filter id="hudaGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="divineLight" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComponentTransfer in="blur" result="boost">
        <feFuncA type="linear" slope="1.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="boost"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nobleShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1. BASE BACKGROUND: ROYAL ISLAMIC ARCHED SHIELD -->
  <rect width="512" height="512" rx="112" fill="url(#hudaBgGrad)"/>
  <rect width="512" height="512" rx="112" fill="url(#nurGuidanceGlow)"/>

  <!-- 2. LUXURY DOUBLE GOLD ORNAMENTAL FRAMES -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#gold24k)" stroke-width="2.5" opacity="0.9"/>
  <rect x="26" y="26" width="460" height="460" rx="88" fill="none" stroke="#10B981" stroke-width="1.2" stroke-dasharray="10 6" opacity="0.6"/>

  <!-- 3. FOUR CORNER ISLAMIC ARABESQUE CRESTS -->
  <g stroke="url(#gold24k)" stroke-width="2" fill="none" opacity="0.85">
    <path d="M 42 84 L 42 42 L 84 42"/>
    <path d="M 42 62 Q 62 62 62 42"/>
    <circle cx="56" cy="56" r="3.5" fill="url(#gold24k)"/>
    <path d="M 470 84 L 470 42 L 428 42"/>
    <path d="M 470 62 Q 450 62 450 42"/>
    <circle cx="456" cy="56" r="3.5" fill="url(#gold24k)"/>
    <path d="M 42 428 L 42 470 L 84 470"/>
    <path d="M 42 450 Q 62 450 62 470"/>
    <circle cx="56" cy="456" r="3.5" fill="url(#gold24k)"/>
    <path d="M 470 428 L 470 470 L 428 470"/>
    <path d="M 470 450 Q 450 450 450 470"/>
    <circle cx="456" cy="456" r="3.5" fill="url(#gold24k)"/>
  </g>

  <!-- 4. CELESTIAL BEAMS OF GUIDANCE -->
  <g opacity="0.25" stroke="url(#gold24k)" stroke-width="1.2">
    <line x1="256" y1="130" x2="80" y2="80" stroke-dasharray="6 6"/>
    <line x1="256" y1="130" x2="432" y2="80" stroke-dasharray="6 6"/>
    <line x1="256" y1="130" x2="50" y2="200" stroke-dasharray="6 6"/>
    <line x1="256" y1="130" x2="462" y2="200" stroke-dasharray="6 6"/>
  </g>

  <!-- 5. SACRED RUB EL HIZB MANDALA -->
  <g transform="translate(256, 210)" filter="url(#divineLight)">
    <rect x="-106" y="-106" width="212" height="212" rx="22" fill="none" stroke="url(#gold24k)" stroke-width="3.2" opacity="0.6"/>
    <rect x="-106" y="-106" width="212" height="212" rx="22" fill="none" stroke="url(#gold24k)" stroke-width="3.2" opacity="0.6" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="url(#gold24k)" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.65"/>
    <circle cx="0" cy="0" r="82" fill="none" stroke="#10B981" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- 6. GLOWING MIHRAB ARCH SILHOUETTE -->
  <g filter="url(#nobleShadow)">
    <path d="M 168 300 L 168 180 C 168 120, 256 80, 256 80 C 256 80, 344 120, 344 180 L 344 300 Z" fill="#022818" stroke="url(#gold24k)" stroke-width="2.2" opacity="0.6"/>
    <path d="M 178 295 L 178 185 C 178 132, 256 95, 256 95 C 256 95, 334 132, 334 185 L 334 295 Z" fill="none" stroke="#10B981" stroke-width="1" stroke-dasharray="4 4" opacity="0.45"/>
  </g>

  <!-- 7. THE HOLY MUSHAF AL-HUDA -->
  <g transform="translate(256, 216)" filter="url(#nobleShadow)">
    <path d="M -160 22 C -100 -6, -26 -2, 0 16 C 26 -2, 100 -6, 160 22 C 164 52, 162 84, 160 120 C 100 94, 26 97, 0 118 C -26 97, -100 94, -160 120 C -162 84, -164 52, -160 22 Z" fill="#021F12" stroke="url(#gold24k)" stroke-width="5" stroke-linejoin="round"/>

    <!-- Left Page -->
    <path d="M -152 28 C -96 2, -24 6, 0 24 L 0 122 C -24 103, -96 100, -152 126 Z" fill="url(#pageLeftLuminous)" stroke="#0F172A" stroke-width="1.2"/>
    <path d="M -142 36 C -92 12, -28 16, -6 32 L -6 116 C -28 99, -92 97, -142 120 Z" fill="none" stroke="url(#gold24k)" stroke-width="1.4" opacity="0.85"/>
    <line x1="-130" y1="52" x2="-22" y2="45" stroke="#047857" stroke-width="2.6" stroke-linecap="round" opacity="0.8"/>
    <line x1="-130" y1="67" x2="-22" y2="60" stroke="#047857" stroke-width="2.6" stroke-linecap="round" opacity="0.8"/>
    <line x1="-130" y1="82" x2="-22" y2="75" stroke="#047857" stroke-width="2.6" stroke-linecap="round" opacity="0.8"/>
    <line x1="-130" y1="97" x2="-44" y2="90" stroke="url(#gold24k)" stroke-width="2.8" stroke-linecap="round" opacity="0.95"/>

    <!-- Right Page -->
    <path d="M 0 24 C 24 6, 96 2, 152 28 L 152 126 C 96 100, 24 103, 0 122 Z" fill="url(#pageRightLuminous)" stroke="#0F172A" stroke-width="1.2"/>
    <path d="M 6 32 C 28 16, 92 12, 142 36 L 142 120 C 92 97, 28 99, 6 116 Z" fill="none" stroke="url(#gold24k)" stroke-width="1.4" opacity="0.85"/>
    <line x1="22" y1="45" x2="130" y2="52" stroke="#92400E" stroke-width="2.6" stroke-linecap="round" opacity="0.8"/>
    <line x1="22" y1="60" x2="130" y2="67" stroke="#92400E" stroke-width="2.6" stroke-linecap="round" opacity="0.8"/>
    <line x1="22" y1="75" x2="130" y2="82" stroke="#92400E" stroke-width="2.6" stroke-linecap="round" opacity="0.8"/>
    <line x1="44" y1="90" x2="130" y2="97" stroke="url(#gold24k)" stroke-width="2.8" stroke-linecap="round" opacity="0.95"/>

    <!-- Center Spine -->
    <path d="M -4 20 L 4 20 L 4 128 L -4 128 Z" fill="#01130A" opacity="0.85"/>

    <!-- Ruby Ribbon -->
    <path d="M -2 22 Q -5 85 14 134 L 25 156 L 36 142 L 27 128 Q 5 80 4 22 Z" fill="url(#rubyRibbon)" stroke="url(#gold24k)" stroke-width="1.2"/>
    <g transform="translate(25, 156) scale(0.65)">
      <rect x="-6" y="-6" width="12" height="12" fill="url(#gold24k)" stroke="#000" stroke-width="0.8"/>
      <rect x="-6" y="-6" width="12" height="12" fill="url(#gold24k)" stroke="#000" stroke-width="0.8" transform="rotate(45)"/>
    </g>
  </g>

  <!-- 8. THE BEACON OF NUR ILIEHI -->
  <g transform="translate(256, 142)" filter="url(#hudaGlow)">
    <circle cx="0" cy="0" r="42" fill="url(#nurGuidanceGlow)" opacity="0.95"/>
    <circle cx="0" cy="0" r="28" fill="url(#emeraldGem)" stroke="url(#gold24k)" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="15" fill="#FFFFFF" opacity="0.9"/>
    <path d="M -15 0 L -9 -7 L -4 7 L 0 -13 L 4 13 L 9 -7 L 15 0" fill="none" stroke="#012415" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-32" cy="-15" r="2.5" fill="#FDE68A"/>
    <circle cx="32" cy="-13" r="2.5" fill="#FDE68A"/>
    <circle cx="0" cy="-38" r="3.2" fill="#FFFBEB"/>
  </g>

  <!-- 9. NOBLE BRAND TYPOGRAPHY: AL-HUDA -->
  <g filter="url(#nobleShadow)">
    <text x="256" y="418" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="54" fill="url(#gold24k)" text-anchor="middle" letter-spacing="9">AL-HUDA</text>
    <g transform="translate(256, 452)">
      <rect x="-135" y="-14" width="270" height="27" rx="13.5" fill="#011F13" stroke="url(#gold24k)" stroke-width="1.6" opacity="0.95"/>
      <text x="0" y="4.5" font-family="'Plus Jakarta Sans', 'Outfit', system-ui, sans-serif" font-weight="800" font-size="12" fill="#6EE7B7" text-anchor="middle" letter-spacing="4">CAHAYA PETUNJUK</text>
    </g>
  </g>
</svg>
