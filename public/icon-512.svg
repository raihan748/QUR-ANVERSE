<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Outer Neobrutal Emerald Background with Hard Shadow Border -->
  <rect width="512" height="512" rx="110" fill="#0B4627" stroke="#000000" stroke-width="16"/>
  
  <!-- Outer Gold Geometric Dashed Border -->
  <rect x="26" y="26" width="460" height="460" rx="90" fill="none" stroke="#F59E0B" stroke-width="8" stroke-dasharray="14 10"/>
  
  <!-- Islamic 8-Point Geometric Star (Rub el Hizb) Background Watermark -->
  <g transform="translate(256, 230)" fill="#F59E0B" opacity="0.18">
    <rect x="-140" y="-140" width="280" height="280" rx="28"/>
    <rect x="-140" y="-140" width="280" height="280" rx="28" transform="rotate(45)"/>
  </g>

  <!-- Open Mushaf / Holy Qur'an with Neobrutalism 3D offset -->
  <g transform="translate(256, 210)">
    <!-- Shadow Backing -->
    <path d="M -180 30 C -120 5, -30 5, 0 35 C 30 5, 120 5, 180 30 L 180 160 C 120 135, 30 135, 0 165 C -30 135, -120 135, -180 160 Z" fill="#000000" transform="translate(10, 10)"/>
    
    <!-- Left Page (Ivory White) -->
    <path d="M -180 30 C -120 5, -30 5, 0 35 L 0 165 C -30 135, -120 135, -180 160 Z" fill="#FFFDF7" stroke="#000000" stroke-width="10"/>
    <!-- Right Page (Amber Gold) -->
    <path d="M 0 35 C 30 5, 120 5, 180 30 L 180 160 C 120 135, 30 135, 0 165 Z" fill="#F59E0B" stroke="#000000" stroke-width="10"/>
    
    <!-- Center Spine & Gold Ribbon Bookmark -->
    <path d="M 0 35 L 0 195 L 14 175 L 28 195 L 28 40" fill="#EF4444" stroke="#000000" stroke-width="6"/>
    
    <!-- Left Page Verse Lines -->
    <line x1="-150" y1="65" x2="-30" y2="65" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
    <line x1="-150" y1="95" x2="-30" y2="95" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
    <line x1="-150" y1="125" x2="-50" y2="125" stroke="#111827" stroke-width="6" stroke-linecap="round"/>

    <!-- Right Page Verse Lines -->
    <line x1="30" y1="65" x2="150" y2="65" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
    <line x1="30" y1="95" x2="150" y2="95" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
    <line x1="50" y1="125" x2="150" y2="125" stroke="#111827" stroke-width="6" stroke-linecap="round"/>

    <!-- AI Floating Orb / Neural Pulse on top of Quran -->
    <g transform="translate(0, -50)">
      <circle cx="0" cy="0" r="42" fill="#10B981" stroke="#000000" stroke-width="8"/>
      <!-- Audio Waveform / Sparkle in Center -->
      <path d="M -18 0 L -12 -12 L -6 12 L 0 -18 L 6 18 L 12 -12 L 18 0" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>

  <!-- Typography: QURANVERSE in Bold Neo-Display Font -->
  <text x="256" y="440" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="52" fill="#F59E0B" text-anchor="middle" stroke="#000000" stroke-width="6" letter-spacing="4">QURANVERSE</text>
</svg>
